<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Khushmeet Shergill</title>
  <meta name="description" content="Khushmeet Shergill, infrastructure engineer in the Bay Area.">

  <link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">

  <!-- Runs before first paint so the right season's colors show immediately. -->
  <script src="season.js"></script>
  <script src="content.js" defer></script>
  <script src="render.js" defer></script>
  <script src="life.js" defer></script>
</head>
<body>
  <canvas id="life" aria-hidden="true"></canvas>

  <main class="panel">
    <header class="head">
      <h1 data-slot="name"></h1>
      <p class="intro" data-slot="intro"></p>
      <nav class="social" aria-label="Elsewhere" data-slot="links"></nav>
    </header>

    <section class="sec" aria-labelledby="now-title">
      <h2 id="now-title">Now</h2>
      <div data-slot="now"></div>
    </section>

    <section class="sec" aria-labelledby="building-title">
      <h2 id="building-title">Building</h2>
      <div data-slot="building"></div>
    </section>

    <section class="sec" aria-labelledby="work-title">
      <h2 id="work-title">Work</h2>
      <div data-slot="work"></div>
    </section>

    <section class="sec" aria-labelledby="education-title">
      <h2 id="education-title">Education</h2>
      <div data-slot="education"></div>
    </section>

    <p class="colophon" data-slot="colophon"></p>

    <noscript>
      <p>This page fills itself in with JavaScript. You can reach me at khushmeet@hey.com.</p>
    </noscript>
  </main>

  <button class="pause" id="pause" type="button" aria-label="Pause the background animation" title="Pause animation">
    <svg aria-hidden="true"><use href="#icon-pause"></use></svg>
  </button>

  <!-- Row layouts that render.js fills from content.js -->
  <template id="entry">
    <div class="row">
      <p class="when"></p>
      <div>
        <h3><span class="title"></span><span class="role"></span></h3>
        <p class="text"></p>
      </div>
    </div>
  </template>

  <template id="project">
    <div class="row project">
      <h3 class="title"></h3>
      <p class="text"></p>
    </div>
  </template>

  <template id="link">
    <a><svg class="icon" aria-hidden="true"><use></use></svg></a>
  </template>

  <!-- Icons, referenced by name from content.js (icon: 'github' uses #icon-github) -->
  <svg class="sprite" aria-hidden="true">

    <symbol id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>

  </svg>
</body>
</html>
